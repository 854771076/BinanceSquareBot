name: Run BinanceSquareBot

on:
  schedule:
    # 每天9点到22点30分执行一次
    - cron: "30 * * * *"
  workflow_dispatch: # 支持手动触发并行执行

permissions:
  contents: write  # 赋予写仓库内容的权限

jobs:
  run-bot-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.inputs.use_parallel != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          # ffmpeg 用于视频帖自动抽封面（无视频源时不会被调用，但二进制需存在）
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Create data, logs and media directories
        run: |
          mkdir -p data logs data/media/pexels

      - name: Run ALL sources in parallel
        env:
          # 全局配置
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LOG_LEVEL: INFO

          # BinanceTarget 配置 (多 API Key)
          BINANCE_TARGET_API_KEYS: ${{ secrets.BINANCE_TARGET_API_KEYS }}
          BINANCE_TARGET_DAILY_MAX_POSTS_PER_KEY: 100
          BINANCE_TARGET_DAILY_MAX_UPLOADS_PER_KEY: 400
          BINANCE_TARGET_STOP_WORDS: bitget,okx,bybit

          # FnSource 配置
          FN_SOURCE_ENABLED: true
          FN_SOURCE_DAILY_MAX_EXECUTIONS: 20

          # PolymarketSource 配置
          POLYMARKET_SOURCE_ENABLED: false
          POLYMARKET_SOURCE_DAILY_MAX_EXECUTIONS: 10

          # FollowinSource 配置
          FOLLOWIN_SOURCE_ENABLED: true
          FOLLOWIN_SOURCE_DAILY_MAX_EXECUTIONS: 50

          # Pexels 配图服务（已停用；需要时设 enabled + key 并加 --enable-pexels）
          PEXELS_SOURCE_ENABLED: false

          # 币安官方公告润色
          BINANCE_ANN_SOURCE_ENABLED: true
          BINANCE_ANN_SOURCE_MAX_ITEMS_PER_RUN: 3

          # 广场热门改写
          SQUARE_HOT_SOURCE_ENABLED: true
        run: |
          # 启用: Fn, Followin, BinanceAnn, SquareHot
          # Pexels 配图已停用
          poetry run binance-square-bot parallel --workers 10 --total-per-run 25 \
            --publish-workers 6 --enable-binance-ann --enable-square-hot

      - name: Commit and push if changes
        env:
          BRANCH_NAME: ${{ github.event.repository.default_branch }}
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

          echo "🔄 Syncing with remote (branch: $BRANCH_NAME)..."
          git fetch origin $BRANCH_NAME

          echo "💾 Saving updated app.db..."
          cp data/app.db /tmp/app.db.tmp

          echo "🧹 Cleaning all working directory changes..."
          git reset --hard origin/$BRANCH_NAME
          git clean -fd

          echo "📂 Restoring updated app.db..."
          cp /tmp/app.db.tmp data/app.db

          git add data/app.db

          if git diff --quiet && git diff --staged --quiet; then
            echo "📭 No changes to commit"
            exit 0
          fi

          echo "📝 Committing changes..."
          TIMESTAMP=$(TZ=Asia/Shanghai date "+%Y-%m-%d %H:%M:%S")
          git commit -m "Auto update app.db by BinanceSquareBot (parallel) at $TIMESTAMP"

          echo "⬆️ Pushing changes..."
          for i in {1..5}; do
            git pull --rebase origin $BRANCH_NAME && git push origin $BRANCH_NAME && {
              echo "✅ Successfully pushed on attempt $i"
              exit 0
            }
            echo "⚠️ Attempt $i failed, waiting $((i*3)) seconds..."
            sleep $((i * 3))
          done

          echo "❌ Failed to push after 5 attempts"
          exit 1

  